services:
  tv-server:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      IPTV_REPOSITORY_URL: https://github.com/iptv-org/iptv.git
      SYNC_INTERVAL_HOURS: 6
      GIT_TIMEOUT_MS: 120000
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - home-tv-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz',{method:'POST'}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  home-tv-data:
