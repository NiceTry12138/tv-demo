services:
  tv-server:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      HEALTH_CHECK_INTERVAL_HOURS: 1
      HEALTH_CHECK_TIMEOUT_MS: 8000
      HEALTH_CHECK_CONCURRENCY: 16
      ADMIN_USERNAME: cong01
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      MAX_UPLOAD_BYTES: 26214400
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - home-tv-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  home-tv-data:
